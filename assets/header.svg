<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 700; fill: #ffffff;
               opacity: 0; animation: fade 1.2s ease-out 0.2s forwards; }
      .sub   { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; letter-spacing: 2px; fill: #8fd3f4;
               opacity: 0; animation: fade 1.2s ease-out 0.9s forwards; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <path fill="rgba(255,255,255,0.07)"
        d="M0 175 Q125 140 250 175 T500 175 T750 175 T1000 175 T1250 175 T1500 175 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path fill="rgba(255,255,255,0.05)"
        d="M0 190 Q125 160 250 190 T500 190 T750 190 T1000 190 T1250 190 T1500 190 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="100" text-anchor="middle" class="title">Trần Quang Phục</text>
  <text x="500" y="145" text-anchor="middle" class="sub">FULL-STACK &amp; MOBILE DEVELOPER</text>
</svg>
